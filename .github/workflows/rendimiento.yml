name: Pruebas de rendimiento (JMeter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JMETER_VERSION: "5.6.3"

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar JMeter ${{ env.JMETER_VERSION }}
        run: |
          curl -fsSL -o jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf jmeter.tgz -C "$HOME"
          echo "$HOME/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verificar versiones
        run: |
          java -version
          jmeter --version

      - name: Levantar la API en el puerto 8080 y esperar a /api/salud
        run: |
          nohup python3 api/ticketmania_simple.py > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/salud; then
              echo
              echo "API lista (intento $i)"
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondió en 30 s"
          cat api.log
          exit 1

      - name: Ejecutar JMeter en modo no-GUI
        working-directory: pruebas/jmeter
        run: jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      - name: Revisar resultados (rojo si hay peticiones fallidas)
        working-directory: pruebas/jmeter
        run: |
          python3 - <<'PY'
          import csv, sys
          total = fallidas = 0
          with open("resultados.jtl", newline="", encoding="utf-8") as f:
              for fila in csv.DictReader(f):
                  total += 1
                  if fila["success"].strip().lower() != "true":
                      fallidas += 1
          print(f"Muestras: {total} | Fallidas: {fallidas}")
          if total == 0 or fallidas > 0:
              sys.exit(1)
          PY

      - name: Subir el reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rendimiento
          path: pruebas/jmeter/reporte
          if-no-files-found: warn
